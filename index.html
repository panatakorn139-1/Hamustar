<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เทอเป็นแฮมเตอร์รึป่าว</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Mali', cursive, sans-serif !important;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-300 via-purple-300 to-indigo-400 min-h-screen flex items-center justify-center overflow-hidden">

    <!-- หน้าแรก -->
    <div id="questionPage" class="text-center px-4 w-full max-w-2xl">
        <h1 class="text-3xl sm:text-4xl md:text-6xl font-bold text-white mb-8 md:mb-12 drop-shadow-lg">
            เทอเป็นแฮมเตอร์รึป่าว 🐹
        </h1>

        <div class="relative min-h-[200px] flex items-center justify-center">
            <!-- ปุ่มใช่ -->
            <button
                id="yesBtn"
                class="bg-green-500 hover:bg-green-600 text-white font-bold text-xl sm:text-2xl px-8 sm:px-12 py-4 sm:py-6 rounded-full shadow-2xl transform hover:scale-110 transition-all duration-200 z-10">
                ใช่ 🐹💚
            </button>

            <!-- ปุ่มไม่ใช่ (จะหนี) -->
            <button
                id="noBtn"
                class="bg-red-500 hover:bg-red-600 text-white font-bold text-xl sm:text-2xl px-8 sm:px-12 py-4 sm:py-6 rounded-full shadow-2xl transition-all duration-200 fixed"
                style="opacity: 0;">
                ไม่ใช่ ❌
            </button>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const questionPage = document.getElementById('questionPage');

        // ฟังก์ชันสุ่มตำแหน่งใหม่ของปุ่ม
        function moveButton() {
            // กำหนด padding จากขอบหน้าจอ
            const padding = 20;

            // คำนวณขนาดหน้าจอที่ใช้งานได้
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;

            // คำนวณขนาดปุ่ม
            const buttonWidth = noBtn.offsetWidth;
            const buttonHeight = noBtn.offsetHeight;

            // คำนวณตำแหน่งสูงสุดที่ปุ่มสามารถอยู่ได้ (ไม่ออกนอกจอ)
            const maxX = screenWidth - buttonWidth - padding;
            const maxY = screenHeight - buttonHeight - padding;

            // สุ่มตำแหน่งใหม่โดยอยู่ในขอบเขตที่กำหนด
            const randomX = Math.max(padding, Math.min(maxX, Math.floor(Math.random() * maxX)));
            const randomY = Math.max(padding, Math.min(maxY, Math.floor(Math.random() * maxY)));

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // กำหนดตำแหน่งเริ่มต้นของปุ่ม "ไม่ใช่"
        function initializeNoButton() {
            const yesRect = yesBtn.getBoundingClientRect();
            const isMobile = window.innerWidth < 768; // md breakpoint
            const padding = 20;

            let targetX, targetY;

            if (isMobile) {
                // บนมือถือ: วางไว้ตรงกลางหน้าจอ ด้านล่างปุ่ม "ใช่"
                const centerX = (window.innerWidth - noBtn.offsetWidth) / 2;
                targetX = centerX;
                targetY = yesRect.bottom + 30;
            } else {
                // บนคอม: วางไว้ด้านขวาปุ่ม "ใช่"
                targetX = yesRect.right + 50;
                targetY = yesRect.top;
            }

            // ตรวจสอบไม่ให้ออกนอกหน้าจอ
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            targetX = Math.max(padding, Math.min(maxX, targetX));
            targetY = Math.max(padding, Math.min(maxY, targetY));

            noBtn.style.left = targetX + 'px';
            noBtn.style.top = targetY + 'px';

            // แสดงปุ่มหลังจากกำหนดตำแหน่งเสร็จแล้ว
            noBtn.style.opacity = '1';
        }

        // เริ่มต้นตำแหน่งปุ่มเมื่อโหลดหน้า
        window.addEventListener('load', () => {
            // รอให้ DOM render เสร็จก่อน
            setTimeout(initializeNoButton, 100);
        });
        window.addEventListener('resize', () => {
            setTimeout(initializeNoButton, 100);
        });

        // นับจำนวนครั้งที่พยายามหนี
        let escapeCount = 0;
        const tauntLabels = [
            'ไม่ใช่ ❌',
            'จับไม่ได้น้าาา 😜',
            'พยายามอีกหน่อย 🥱',
            'ยังไม่ยอมแพ้อีกเหรอ 🙄',
            'เก่งเนอะ 5 ครั้งแล้ว 👀',
            'เลิกได้แล้ว 😤',
            'กดต่อก็เท่านั้น 💅',
            'แฮมเตอร์เห็นใจเหอะ 🐹',
            'ไม่ได้กดได้ง่ายๆนะ 🚫',
            'OK พอแล้วน่ะ 😮‍💨'
        ];

        function tauntNoBtn() {
            escapeCount++;
            const label = tauntLabels[Math.min(escapeCount, tauntLabels.length - 1)];
            noBtn.textContent = label;
            moveButton();
        }

        // สำหรับคอม - หนีเมื่อ cursor เข้าใกล้
        noBtn.addEventListener('mouseenter', tauntNoBtn);

        // สำหรับมือถือ - หนีเมื่อพยายามจะกด
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            tauntNoBtn();
        });

        // ป้องกันการคลิก
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            tauntNoBtn();
        });

        // Title tab เปลี่ยนตอน blur
        const originalTitle = document.title;
        const awayTitles = ['กลับมาน้าาา 🥺', 'แฮมเตอร์รออยู่ 🐹', 'ไปไหนน้า 😢'];
        let titleInterval = null;
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                let i = 0;
                titleInterval = setInterval(() => {
                    document.title = awayTitles[i % awayTitles.length];
                    i++;
                }, 1500);
            } else {
                clearInterval(titleInterval);
                document.title = originalTitle;
            }
        });

        // Cursor hamster follower
        const isTouch = window.matchMedia('(hover: none)').matches || 'ontouchstart' in window;
        const hamCursor = document.createElement('div');
        hamCursor.textContent = '🐹';
        hamCursor.style.cssText = 'position:fixed;pointer-events:none;font-size:40px;line-height:1;z-index:9999;left:0;top:0;transition:transform 0.08s ease-out;will-change:transform;opacity:0;';
        document.body.appendChild(hamCursor);

        function moveHam(x, y) {
            hamCursor.style.opacity = '1';
            hamCursor.style.transform = `translate(${x - 20}px, ${y - 20}px)`;
        }

        if (isTouch) {
            // mobile - follow finger
            document.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                if (t) moveHam(t.clientX, t.clientY);
            }, { passive: true });
            document.addEventListener('touchmove', (e) => {
                const t = e.touches[0];
                if (t) moveHam(t.clientX, t.clientY);
            }, { passive: true });
        } else {
            document.addEventListener('mousemove', (e) => moveHam(e.clientX, e.clientY));
        }

        // เมื่อกดปุ่ม "ใช่"
        const isDev = ['localhost', '127.0.0.1', ''].includes(location.hostname);
        const questionsUrl = isDev
            ? 'questions.html'
            : 'https://panatakorn139-1.github.io/Hamustar/questions.html';

        yesBtn.addEventListener('click', () => {
            window.location.href = questionsUrl;
        });
    </script>
</body>
</html>
